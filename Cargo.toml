[workspace]
resolver = "2"
members = ["core", "firmware"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
robo-core = { path = "core" }

[profile.release]
# Embedded firmware: optimise for size/speed, keep debug info for symbolised panics.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
